name: release

# Al subir una etiqueta vX.Y.Z, o al subir a la rama `release` (la etiqueta
# sale entonces de versionName), se compila el APK y se publica la release. Si el repo tiene los secretos de firma (KEYSTORE_B64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD) sale el APK release firmado con tu clave; si no, el
# de depuración.
on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

jobs:
  # El receptor del PC con teclado y ratón (Windows), para adjuntarlo
  receptor-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar el receptor
        working-directory: desktop
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: receptor-windows
          path: desktop/target/release/PepoMote.exe

  release:
    needs: receptor-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Versión
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else
            TAG="v$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            export KEYSTORE_PATH=release.keystore
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../RevolutionMote-Plus-${TAG}.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../RevolutionMote-Plus-${TAG}.apk
          fi
      - uses: actions/download-artifact@v4
        with:
          name: receptor-windows
          path: receptor
      - name: update.json (aviso de versión nueva en la app)
        run: |
          cp "RevolutionMote-Plus-${TAG}.apk" RevolutionMote-Plus.apk
          python3 - <<'PY'
          import hashlib, json, os, datetime
          tag = os.environ["TAG"]; v = tag.lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          data = open("RevolutionMote-Plus.apk", "rb").read()
          notes = {"es": ["Nueva versión de RevolutionMote+."], "en": ["New RevolutionMote+ version."]}
          extra = f"docs/releases/{tag}.notes.json"
          if os.path.exists(extra):
              notes = json.load(open(extra, encoding="utf-8"))
          m = {
              "schema": 1, "version": v,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "release_url": f"https://github.com/{repo}/releases/tag/v{v}",
              "notes": notes,
              "assets": {"android-universal": {
                  "name": "RevolutionMote-Plus.apk",
                  "url": f"https://github.com/{repo}/releases/download/v{v}/RevolutionMote-Plus.apk",
                  "size": len(data), "sha256": hashlib.sha256(data).hexdigest()}},
          }
          json.dump(m, open("update.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp receptor/PepoMote.exe "RevolutionMote-Plus-Receptor-Windows-${TAG}.exe"
          NOTES=docs/releases/${TAG}.md
          [ -f "$NOTES" ] || NOTES=/dev/null
          # Un solo APK por release: RevolutionMote-Plus.apk (el nombre fijo que
          # busca el aviso de actualización de la app)
          gh release create "$TAG" RevolutionMote-Plus.apk "RevolutionMote-Plus-Receptor-Windows-${TAG}.exe" update.json --target "$GITHUB_SHA" \
            --title "RevolutionMote+ ${TAG}" --notes-file "$NOTES" \
            || gh release upload "$TAG" RevolutionMote-Plus.apk "RevolutionMote-Plus-Receptor-Windows-${TAG}.exe" update.json --clobber
          # Restos de cuando se subían dos APK iguales
          gh release delete-asset "$TAG" "RevolutionMote-Plus-${TAG}.apk" -y 2>/dev/null || true
          gh release delete-asset v1.2.0 RevolutionMote-Plus-v1.2.0.apk -y 2>/dev/null || true
