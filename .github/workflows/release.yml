name: release

# Al subir una etiqueta vX.Y.Z, o al subir a la rama `release` (la etiqueta
# sale entonces de versionName), se compila el APK y se publica la release. Si el repo tiene los secretos de firma (KEYSTORE_B64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD) sale el APK release firmado con tu clave; si no, el
# de depuración.
on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

jobs:
  # El receptor del PC con teclado y ratón (Windows), para adjuntarlo
  receptor-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar el receptor
        working-directory: desktop
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: receptor-windows
          path: desktop/target/release/PepoMote.exe

  release:
    needs: receptor-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Versión
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else
            TAG="v$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            export KEYSTORE_PATH=release.keystore
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../RevolutionMote-Plus-${TAG}.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../RevolutionMote-Plus-${TAG}.apk
          fi
      - uses: actions/download-artifact@v4
        with:
          name: receptor-windows
          path: receptor
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp receptor/PepoMote.exe "RevolutionMote-Plus-Receptor-Windows-${TAG}.exe"
          NOTES=docs/releases/${TAG}.md
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$TAG" "RevolutionMote-Plus-${TAG}.apk" "RevolutionMote-Plus-Receptor-Windows-${TAG}.exe" --target "$GITHUB_SHA" \
            --title "RevolutionMote+ ${TAG}" --notes-file "$NOTES" \
            || gh release upload "$TAG" "RevolutionMote-Plus-${TAG}.apk" "RevolutionMote-Plus-Receptor-Windows-${TAG}.exe" --clobber
