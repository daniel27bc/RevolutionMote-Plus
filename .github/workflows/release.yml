name: release

# Al subir una etiqueta vX.Y.Z se compila el APK y se publica la release con
# él. Si el repo tiene los secretos de firma (KEYSTORE_B64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD) sale el APK release firmado con tu clave; si no, el
# de depuración.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            export KEYSTORE_PATH=release.keystore
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../RevolutionMote-Plus-${GITHUB_REF_NAME}.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../RevolutionMote-Plus-${GITHUB_REF_NAME}.apk
          fi
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=docs/releases/${GITHUB_REF_NAME}.md
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$GITHUB_REF_NAME" "RevolutionMote-Plus-${GITHUB_REF_NAME}.apk" \
            --title "RevolutionMote+ ${GITHUB_REF_NAME}" --notes-file "$NOTES" \
            || gh release upload "$GITHUB_REF_NAME" "RevolutionMote-Plus-${GITHUB_REF_NAME}.apk" --clobber
