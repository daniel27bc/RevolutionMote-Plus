name: ios

# Sin Mac a mano: aquí se genera el proyecto (XcodeGen), se compila, pasan los
# tests en el simulador y se empaqueta el IPA SIN FIRMAR para AltStore /
# Sideloadly (ellos lo firman con el Apple ID de quien lo instala).
on:
  push:
    branches: [main, ios, next, "feat/**"]
    paths: ["ios/**", "protocol/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "protocol/**"]
  workflow_call:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version | head -1

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        working-directory: ios
        run: xcodegen generate

      - name: Simulador
        id: sim
        run: |
          device="$(xcrun simctl list devices booted -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [ -z "$device" ]; then
            device="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries | sort_by(.key) | reverse | .[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')"
          fi
          test -n "$device"
          echo "id=$device" >> "$GITHUB_OUTPUT"

      # Las capturas de todas las pantallas (ScreenshotTests, ImageRenderer)
      # se escriben en /tmp/pepomote-shots y salen como artefacto ios-shots:
      # así se ven los layouts de iPhone y de iPad sin tener el dispositivo
      - name: Tests en el simulador
        working-directory: ios
        env:
          TEST_RUNNER_PEPOMOTE_SHOTS_DIR: /tmp/pepomote-shots
        run: |
          mkdir -p ../build /tmp/pepomote-shots
          set +e
          xcodebuild test -project PepoMote.xcodeproj -scheme PepoMote \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath ../build/tests.xcresult \
            CODE_SIGNING_ALLOWED=NO > ../build/test.log 2>&1
          status=$?
          set -e
          grep -E "error:|warning: .*Swift|Test Suite|Test Case .* (passed|failed)|Executed|\*\* (TEST|BUILD)" ../build/test.log || true
          exit $status

      - name: IPA sin firmar (dispositivo)
        working-directory: ios
        run: |
          set +e
          xcodebuild build -project PepoMote.xcodeproj -scheme PepoMote -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath ../build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > ../build/device.log 2>&1
          status=$?
          set -e
          grep -E "error:|\*\* BUILD" ../build/device.log || true
          if [ $status -ne 0 ]; then exit $status; fi
          app="$(find ../build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app"
          rm -rf ../dist/Payload
          mkdir -p ../dist/Payload
          cp -R "$app" ../dist/Payload/
          (cd ../dist && rm -f RevolutionMote-Plus.ipa && zip -qr RevolutionMote-Plus.ipa Payload && rm -rf Payload)
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: RevolutionMote-Plus-ios
          path: dist/RevolutionMote-Plus.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shots
          path: /tmp/pepomote-shots/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-logs
          path: |
            build/test.log
            build/device.log
