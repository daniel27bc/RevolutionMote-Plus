name: android

on:
  push:
    branches: [main, next, "feat/**"]
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**"]
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Tests, lint y APK debug
        working-directory: android
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintRelease assembleDebug --no-daemon
      # La firma release se activa en h5 con los secrets:
      # KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: PepoMote-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # APK y capturas de la interfaz en una rama aparte (ci-out/<rama>), sin
      # historial: así se pueden bajar con git aunque los artefactos no
      - name: Publicar APK y capturas
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          cp android/app/build/outputs/apk/debug/app-debug.apk ci-out/ 2>/dev/null || true
          cp -r android/app/build/screenshots ci-out/ 2>/dev/null || true
          echo "${GITHUB_SHA} ${{ job.status }}" > ci-out/BUILD.txt
          cd ci-out
          git init -q
          git checkout -q -b out
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-out/${GITHUB_REF_NAME}
